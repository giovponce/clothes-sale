<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Fondo circular sutil opcional (verde bosque suave) -->
  <circle cx="24" cy="24" r="22" fill="#333d29" />
  
  <!-- Ilustración de una hermosa hojita de árbol en color beige arena/blanco roto -->
  <path 
    d="M24 10 
       C31 12, 38 18, 36 28 
       C35 34, 29 38, 24 38 
       C19 38, 13 34, 12 28 
       C10 18, 17 12, 24 10 Z" 
    fill="none" 
    stroke="#f4f5f0" 
    stroke-width="3" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
  />
  
  <!-- Línea central/nervadura de la hoja -->
  <path 
    d="M24 38 L24 12" 
    fill="none" 
    stroke="#f4f5f0" 
    stroke-width="2.5" 
    stroke-linecap="round" 
  />
  
  <!-- Nervaduras laterales pequeñas -->
  <path 
    d="M24 30 L29 25" 
    fill="none" 
    stroke="#f4f5f0" 
    stroke-width="2" 
    stroke-linecap="round" 
  />
  <path 
    d="M24 26 L19 21" 
    fill="none" 
    stroke="#f4f5f0" 
    stroke-width="2" 
    stroke-linecap="round" 
  />
  <path 
    d="M24 22 L29 17" 
    fill="none" 
    stroke="#f4f5f0" 
    stroke-width="2" 
    stroke-linecap="round" 
  />
</svg>
